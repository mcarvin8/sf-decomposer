---
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docker"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "build(npm)"
    cooldown:
      default-days: 1
    allow:
      - dependency-type: "direct"
    groups:
      config-disassembler:
        patterns:
          - "config-disassembler"
      npm:
        patterns:
          - "*"
        exclude-patterns:
          - "config-disassembler"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(github-actions)"
    groups:
      github-actions:
        patterns:
          - "*"
