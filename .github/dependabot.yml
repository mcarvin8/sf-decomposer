---
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
    versioning-strategy: increase
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(dev-deps)"
    cooldown:
      default-days: 1
    groups:
      salesforce-source-deploy-retrieve:
        patterns:
          - "@salesforce/source-deploy-retrieve"
      dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "@salesforce/source-deploy-retrieve"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'build'
