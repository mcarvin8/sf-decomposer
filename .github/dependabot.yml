---
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docker"
    schedule:
      interval: "monthly"
    versioning-strategy: increase
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(dev-deps)"
    cooldown:
      default-days: 1
    groups:
      dependencies:
        dependency-type: "production"
      dev-dependencies:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    groups:
      github-actions:
        patterns:
          - "*"
