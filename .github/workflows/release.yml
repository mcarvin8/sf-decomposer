name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

  unit-tests:
    name: Unit Tests (ubuntu-latest, node LTS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
        env:
          SF_DISABLE_TELEMETRY: true

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  release:
    name: Release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm ci

      - name: Publish to NPM
        id: publish
        run: |
          NODE_AUTH_TOKEN="" npm publish --access public --tag latest --provenance
          echo "published=true" >> "$GITHUB_OUTPUT"

      # `npm publish` runs the `prepack` script (oclif manifest && oclif readme),
      # which regenerates README.md's Command Reference against the version
      # release-please just bumped. Push that back to main so the repo's README
      # never drifts from what was just published.
      - name: Commit regenerated README
        if: steps.publish.outputs.published == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: regenerate command reference [skip ci]"
          file_pattern: README.md

      # release-please only ever creates the exact vX.Y.Z tag. action.yml pins the GitHub Action
      # to a floating major-version tag (docker://ghcr.io/.../vX) so consumers using
      # `uses: mcarvin8/sf-decomposer@vX` don't need to bump on every release -- but `@vX` only
      # resolves if a real git tag vX exists and points at the latest vX.Y.Z. Move it here.
      - name: Move floating major version tag
        if: steps.publish.outputs.published == 'true'
        run: |
          MAJOR="v$(node -p "require('./package.json').version.split('.')[0]")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force

  # Publishes the GitHub Action's container image to GHCR so consumers pull a prebuilt image
  # (action.yml's runs.image) instead of every workflow run building it fresh from the
  # Dockerfile. Pushes the exact version (vX.Y.Z, immutable) and the floating major tag (vX,
  # force-moved on every release within that major -- action.yml pins to the floating tag so it
  # doesn't need a commit on every patch/minor release, only when the major version changes).
  publish-image:
    name: Publish Action image to GHCR
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags from package.json version
        id: vars
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          MAJOR="v$(node -p "require('./package.json').version.split('.')[0]")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mcarvin8/sf-decomposer:${{ steps.vars.outputs.version }}
            ghcr.io/mcarvin8/sf-decomposer:${{ steps.vars.outputs.major }}
            ghcr.io/mcarvin8/sf-decomposer:latest

  smoke-test:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit

  perf-baseline:
    # Runs after a successful publish so every released version has a
    # comparable timing artifact attached to its run. Does not gate the
    # release - it's an observability run, not a quality gate.
    needs: [smoke-test, release]
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/perf.yml
    with:
      profile: large
      publish: true
    secrets: inherit

  perf-baseline-manyfiles:
    # Chained after perf-baseline (not parallel): both jobs push to the same
    # gh-pages branch/file via auto-push:true, and two concurrent workflow_call
    # invocations racing that push is exactly the hazard perf.yml's
    # max-parallel:1 guards against for its own in-job matrix. Sequential here
    # costs nothing real - release publishing isn't on anyone's feedback loop.
    needs: [smoke-test, release, perf-baseline]
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/perf.yml
    with:
      profile: manyfiles
      publish: true
    secrets: inherit
