# Performance benchmark for the decompose/recompose pipeline against deterministic
# synthetic large-org fixtures (see scripts/gen-perf-fixtures.ts).
#
# Triggers:
#   - workflow_dispatch  : ad-hoc; pick a profile/formats/types from the UI.
#   - schedule (weekly)  : Monday 05:00 UTC; catches slow drift from npm dep
#                          updates, runner-image refreshes, V8/Rust upstream.
#   - workflow_call      : invoked by release.yml after a successful publish so
#                          every version on npm has a perf artifact attached.
#   - pull_request       : benchmarks the PR base ref and the PR head ref in one
#                          interleaved loop on the same runner, and posts a sticky
#                          comment with the deltas (scripts/compare-perf-baseline.mjs).
#                          Same-runner/same-moment diffing avoids the 20-30%
#                          run-to-run swings a gh-pages-history comparison
#                          would inherit from running on different runners at
#                          different times. Skipped for fork PRs because
#                          GITHUB_TOKEN is read-only there - re-introduce via
#                          a workflow_run companion if/when external
#                          contributions need this. Doc-only PRs are filtered
#                          out so they don't pay the ~6-8 minute cost (base +
#                          head runs).
#
# Profile matrix: schedule/pull_request run `large` (single-huge-file shape),
# `manyfiles` (many-small-files-in-one-directory shape, the one that actually exercises
# config-disassembler's directory-mode concurrent fan-out -- see config-disassembler#97/#99)
# and `manyfiles-overrides` (the same files plus component-scope config overrides and a
# `.sfdecomposerignore`, which moves the type onto one crate call per file -- the
# perFileHandler path; diff its rows against `manyfiles` to see that path's cost)
# as parallel matrix jobs, so a regression in any shape is caught before merge instead of
# waiting for the next weekly/release run. workflow_dispatch and workflow_call keep their
# existing single-profile behavior (`inputs.profile`, default `large`) unchanged -- matrix
# only kicks in when `inputs.profile` isn't set at all, which is exactly the case for
# schedule/pull_request (neither trigger declares an `inputs:` block).
name: Performance

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Fixture size profile'
        type: choice
        default: large
        options:
          - small
          - medium
          - large
          - xlarge
          - manyfiles
          - manyfiles-overrides
      formats:
        description: 'Comma-separated formats to test (xml,json,json5,yaml)'
        type: string
        default: 'xml,json,json5,yaml'
      types:
        description: 'Comma-separated metadata types (blank = defaults from test/perf/decompose.perf.ts)'
        type: string
        default: ''
      publish:
        description: 'Publish runtime/memory results to gh-pages (only enable for runs you want on the dashboard)'
        type: boolean
        default: false
  schedule:
    # Mondays 05:00 UTC - quiet hours on the GitHub-hosted runner pool.
    - cron: '0 5 * * 1'
  pull_request:
    # Skip cosmetic/doc-only PRs so they don't burn ~6-8 minutes of CI per push
    # (base-ref + head-ref runs - see the trigger comment above).
    # Code that can plausibly affect runtime/memory lives outside these paths.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_call:
    inputs:
      profile:
        type: string
        required: false
        default: large
      formats:
        type: string
        required: false
        default: 'xml,json,json5,yaml'
      types:
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish runtime/memory results to gh-pages'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Cancel in-progress perf runs for the same PR/branch when a new commit lands.
# Without this, force-pushing N times to a PR queues N x ~6-8 minute jobs. The
# release/schedule/dispatch flows run on main or detached refs, where each run
# gets a unique group key, so this only collapses redundant PR runs.
concurrency:
  group: perf-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    name: Perf (${{ matrix.profile }})
    # Skip fork PRs: GITHUB_TOKEN is read-only on PRs from forks, so
    # perf-comment couldn't post anyway. If/when external contributions need
    # PR perf comments, move perf-comment into a workflow_run companion that
    # runs in the base repo context and downloads this run's artifact.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Single OS, single Node version: cross-runner / cross-Node perf is too
    # noisy to be useful. Correctness is already covered by test.yml's matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # No max-parallel: this job never writes to gh-pages (perf-publish does,
      # serialized), so profiles can always benchmark on parallel runners.
      matrix:
        # inputs.profile is only populated for workflow_dispatch/workflow_call (the only
        # two triggers that declare an `inputs:` block); schedule/pull_request fall through
        # to the two-profile matrix. See the trigger-comment block above for the full
        # rationale.
        profile: ${{ inputs.profile && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["large","manyfiles","manyfiles-overrides"]') }}
    # Read-only on purpose. This job runs the PR's own code (`npm ci` install
    # scripts, src/, test/perf/), so it must not hold a token that can write
    # anywhere: a compromised dependency would otherwise get push access to
    # every unprotected branch and gh-pages. Writing happens in perf-comment
    # (pull-requests: write) and perf-publish (contents: write), which run no
    # repository code and only consume this job's uploaded artifact.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Don't leave the token in .git/config for PR code to read. The
          # base-ref fetch below works without it (public repo).
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # -----------------------------------------------------------------
      # Same-runner, interleaved baseline (PR only).
      #
      # The PR base ref is checked out into a separate git worktree with its
      # own `npm ci` (so its own config-disassembler build). The single
      # "Run performance suite" step below then times BOTH source trees in
      # one loop, alternating base/head and head/base per repeat, each
      # operation in a fresh child process (test/perf/decompose.perf.ts).
      #
      # This replaces running the whole suite on base and then on head: that
      # always handed head the warmer runner (page cache, CPU boost), which
      # showed up as a steady head-is-faster bias on PRs that changed no
      # runtime code. Fixtures and the measurement harness come from head for
      # both trees, so harness changes in a PR can't masquerade as perf deltas.
      # -----------------------------------------------------------------
      - name: Prepare PR base-ref worktree
        if: github.event_name == 'pull_request'
        # The default checkout is a shallow, single-commit fetch of the PR
        # merge ref, so the base sha usually isn't present locally yet.
        run: |
          git fetch --no-tags --prune --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add --detach "$RUNNER_TEMP/perf-base" "${{ github.event.pull_request.base.sha }}"
          cd "$RUNNER_TEMP/perf-base"
          npm ci
        env:
          # Skip husky's prepare hook inside the throwaway worktree.
          HUSKY: '0'

      - name: Print runner facts
        run: |
          echo "## Runner facts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "image:    $ImageOS / $ImageVersion" >> "$GITHUB_STEP_SUMMARY"
          echo "node:     $(node --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "cpu:      $(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | xargs)" >> "$GITHUB_STEP_SUMMARY"
          echo "cores:    $(nproc)" >> "$GITHUB_STEP_SUMMARY"
          echo "mem:      $(free -h | awk '/^Mem:/ {print $2}')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run performance suite
        run: npm run test:perf
        env:
          PERF_PROFILE: ${{ matrix.profile }}
          PERF_FORMATS: ${{ inputs.formats || 'xml,json,json5,yaml' }}
          PERF_TYPES: ${{ inputs.types }}
          SF_DISABLE_TELEMETRY: true
          # PR runs only: also time the base-ref worktree's src/, interleaved
          # with head (see "Prepare PR base-ref worktree" above).
          PERF_BASE_ROOT: ${{ github.event_name == 'pull_request' && format('{0}/perf-base', runner.temp) || '' }}
          # Node tuning for reproducibility:
          #   - disable JIT randomization-sensitive optimizations off by default
          #   - explicit max old space so a leak fails loudly rather than swapping
          NODE_OPTIONS: '--max-old-space-size=4096'
          # Surface sibling-collision fallback signals from the Rust crate
          # alongside the default `error` lines. A WARN here means a synthetic
          # fixture has degenerated to share unique-id values across siblings
          # (the same shape we patch in src/metadata/uniqueIdElements.ts for
          # real metadata). The 100% byte-retention guard still catches actual
          # data loss; this just makes the cause visible in the action log.
          # See README -> "XML disassemble output (Rust crate)".
          RUST_LOG: warn

      - name: Summarize results
        if: always()
        run: |
          if [ ! -d perf-results ]; then
            echo "No perf-results/ directory; the test likely failed before reporting." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## Perf results (profile=${PERF_PROFILE:-large})" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Format | Sample | Elapsed (ms) | Heap Δ (MB) |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---:|---:|' >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = "perf-results";
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".json")).sort();
            for (const f of files) {
              const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              for (const s of r.samples) {
                const ms = s.elapsedMs.toFixed(1);
                const heap = (s.heapUsedDeltaBytes / 1024 / 1024).toFixed(2);
                process.stdout.write(`| ${r.format} | ${s.label} | ${ms} | ${heap} |\n`);
              }
            }
          ' >> "$GITHUB_STEP_SUMMARY"
        env:
          PERF_PROFILE: ${{ matrix.profile }}

      # ---------------------------------------------------------------------
      # Benchmark JSON + PR comparison (no token needed).
      #
      # perf-to-benchmark.mjs writes perf-runtime.json / perf-memory.json for
      # head, and on PR runs (where perf-results/ also holds the interleaved
      # base reports tagged ref: 'base') perf-runtime-base.json /
      # perf-memory-base.json too. compare-perf-baseline.mjs diffs the two
      # into perf-comparison.md; the perf-comment job posts it.
      #
      # Neither step fails the job on a regression: regressions surface as
      # the comment and a ::warning:: annotation, matching the rest of this
      # workflow's fail-on-alert: false stance.
      # ---------------------------------------------------------------------
      - name: Convert perf-results to benchmark JSON
        run: node scripts/perf-to-benchmark.mjs

      - name: Compare against same-runner baseline (PR)
        if: github.event_name == 'pull_request'
        run: node scripts/compare-perf-baseline.mjs
        env:
          PERF_PROFILE: ${{ matrix.profile }}

      # Uploaded only when every step above succeeded, so its presence is the
      # signal perf-publish relies on: a crashed or partial run leaves no
      # perf-bench-* artifact, and its truncated output can never become a
      # published baseline.
      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v7
        with:
          name: perf-bench-${{ matrix.profile }}
          path: |
            perf-runtime.json
            perf-cpu.json
            perf-memory.json
            perf-runtime-base.json
            perf-cpu-base.json
            perf-memory-base.json
            perf-comparison.md
          retention-days: 30
          if-no-files-found: error

      # Diagnostics, uploaded even on failure.
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            perf-results/
            perf-comparison.md
            perf-runtime-base.json
            perf-cpu-base.json
            perf-memory-base.json
          retention-days: 90
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Sticky PR comment, one per profile.
  #
  # Holds the only write scope a PR run needs, and checks out / installs /
  # runs nothing from the repository: it downloads perf-comparison.md from
  # the perf job's artifact and posts it with the preinstalled gh CLI. The
  # file was produced by the PR's own code, so it is treated as untrusted
  # text -- only ever used as a comment body, under a marker this job writes.
  #
  # always() because a failed perf leg should still replace a stale comment
  # with a "no comparison" notice rather than leave the last push's numbers up.
  # Dependabot PRs are included on purpose: they do get this write scope, and
  # their config-disassembler bumps are the comments that matter most.
  # ---------------------------------------------------------------------------
  perf-comment:
    name: Perf comment (${{ matrix.profile }})
    needs: [perf]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.perf.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ inputs.profile && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["large","manyfiles","manyfiles-overrides"]') }}
    steps:
      - name: Download benchmark JSON
        # Missing when that profile's perf leg failed; the next step posts a
        # notice instead.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: perf-bench-${{ matrix.profile }}

      - name: Post or update sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROFILE: ${{ matrix.profile }}
        run: |
          marker="<!-- same-runner-perf:${PROFILE} -->"
          if [ -f perf-comparison.md ]; then
            report="$(cat perf-comparison.md)"
          else
            report="# Performance comparison (profile=${PROFILE})

          The perf run produced no comparison for this push. Check the Perf (${PROFILE}) job log."
          fi
          jq -n --arg marker "$marker" --arg report "$report" '{body: ($marker + "\n" + $report)}' > payload.json
          id="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" --input payload.json > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" --input payload.json > /dev/null
          fi

  # ---------------------------------------------------------------------------
  # Publish runtime + memory trends to the gh-pages dashboard.
  #
  # Gated to schedule (weekly) and explicit publish=true callers (release.yml)
  # only, so ad-hoc workflow_dispatch runs - which often vary the
  # profile/types/formats inputs - don't pollute the timeline. The dashboard
  # renders at
  #   https://<owner>.github.io/sf-decomposer/dev/bench/runtime/
  #   https://<owner>.github.io/sf-decomposer/dev/bench/cpu/
  #   https://<owner>.github.io/sf-decomposer/dev/bench/memory/
  #
  # The only job holding contents: write. It installs no dependencies and runs
  # no repository code (benchmark-action is a bundled JS action), so its
  # checkout can keep credentials for benchmark-action's own gh-pages push. It
  # downloads the perf job's perf-bench-* artifact, which only exists when that
  # profile's run completed (see "Upload benchmark JSON"), so a crashed run
  # fails the download instead of publishing a truncated baseline.
  #
  # NOTE: do not check `github.event_name == 'workflow_call'` here - inside a
  # reusable workflow `github.event_name` reflects the caller's triggering
  # event (e.g. 'push' from release.yml), never 'workflow_call'.
  #
  # `name:` below is suffixed with matrix.profile ("Decompose Runtime (large)",
  # "Decompose Runtime (manyfiles)") rather than shared across profiles. Each
  # publish call appends a fresh entry to its named series -- it does not merge
  # into an existing entry for the same commit -- so two profiles sharing one
  # name would alternate single-profile entries in that series.
  # ---------------------------------------------------------------------------
  perf-publish:
    name: Perf publish (${{ matrix.profile }})
    needs: [perf]
    if: >-
      always() &&
      needs.perf.result != 'skipped' &&
      (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Every leg pushes to the same gh-pages branch; serialize so pushes
      # can't race.
      max-parallel: 1
      matrix:
        profile: ${{ inputs.profile && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["large","manyfiles","manyfiles-overrides"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download benchmark JSON
        uses: actions/download-artifact@v8
        with:
          name: perf-bench-${{ matrix.profile }}

      - name: Publish runtime benchmark
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Decompose Runtime (${{ matrix.profile }})
          tool: customSmallerIsBetter
          output-file-path: ./perf-runtime.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # GH-hosted runners can swing 20-30% on the same workload; 150% is
          # loose enough to avoid noise but still flag a genuine 1.5x regression.
          alert-threshold: '150%'
          fail-on-alert: false
          comment-on-alert: true
          summary-always: true
          benchmark-data-dir-path: dev/bench/runtime

      - name: Publish CPU benchmark
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # User + system CPU time across all threads (JS and Rust), in ms.
          name: Decompose CPU (${{ matrix.profile }})
          tool: customSmallerIsBetter
          output-file-path: ./perf-cpu.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          skip-fetch-gh-pages: true
          alert-threshold: '150%'
          fail-on-alert: false
          summary-always: true
          benchmark-data-dir-path: dev/bench/cpu

      - name: Publish memory benchmark
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # Peak RSS growth per operation (fresh child process), in MB. Renamed
          # from "Decompose Memory" when the metric changed from JS heapUsed
          # delta, so the dashboard starts a new series instead of splicing two
          # incompatible metrics into one line.
          name: Decompose Peak RSS (${{ matrix.profile }})
          tool: customSmallerIsBetter
          output-file-path: ./perf-memory.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # gh-pages was already fetched by the runtime step above; skip the
          # second fetch to halve checkout time.
          skip-fetch-gh-pages: true
          # Cross-run (different runner) memory comparison; keep a wide band.
          alert-threshold: '200%'
          fail-on-alert: false
          summary-always: true
          benchmark-data-dir-path: dev/bench/memory
